<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTX Hairstylist</title>
    <!-- Google Fonts for the elegant serif and clean sans-serif look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL STYLES --- */
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-pink: #e5a9b0;
            --text-light: #f5f5f5;
            --text-muted: #999999;
            --border-color: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        .logo i {
            color: var(--accent-pink);
            font-size: 18px;
        }

        .menu-icon {
            font-size: 24px;
            color: var(--text-light);
            cursor: pointer;
        }

        /* --- CONTAINER --- */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- TELEGRAM SECTION --- */
        .telegram-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.3s ease;
        }

        .telegram-card:hover {
            background-color: #222222;
        }

        .telegram-icon {
            width: 40px;
            height: 40px;
            background-color: var(--accent-pink);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 20px;
        }

        .telegram-info h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .telegram-info p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* --- PAYMENT SECTION --- */
        .section-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-header .subtitle {
            color: var(--accent-pink);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .section-header h2 span {
            font-style: italic;
            color: var(--accent-pink);
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 50px;
        }

        .payment-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .payment-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-pink);
        }

        .payment-card i {
            font-size: 28px;
            color: var(--accent-pink);
            margin-bottom: 15px;
            display: block;
        }

        .payment-card h4 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .payment-card p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* --- GALLERY SECTION --- */
        .gallery-section {
            margin-bottom: 50px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .gallery-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: opacity 0.3s ease;
        }

        .gallery-grid img:hover {
            opacity: 0.8;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (min-width: 600px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 900px) {
            .container {
                max-width: 900px;
            }
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-crown"></i> HTX Hairstylist
        </div>
        <div class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>

    <div class="container">

        <!-- TELEGRAM CONTACT (Phone number completely removed) -->
        <a href="https://t.me/htxhairstyle" target="_blank" class="telegram-card">
            <div class="telegram-icon">
                <i class="fa-brands fa-telegram"></i>
            </div>
            <div class="telegram-info">
                <h3>Telegram</h3>
                <p>t.me/htxhairstyle</p>
            </div>
        </a>

        <!-- PAYMENT OPTIONS -->
        <section class="payment-section">
            <div class="section-header">
                <div class="subtitle">Payment Options</div>
                <h2>Ways to <span>Pay</span></h2>
                <p>Tap any method below to see payment details.</p>
            </div>

            <div class="payment-grid">
                <!-- PayPal -->
                <a href="#" class="payment-card">
                    <i class="fa-brands fa-paypal"></i>
                    <h4>PayPal</h4>
                    <p>Secure online payment</p>
                </a>

                <!-- Cash App -->
                <a href="#" class="payment-card">
                    <i class="fa-solid fa-dollar-sign"></i>
                    <h4>Cash App</h4>
                    <p>Instant transfer</p>
                </a>

                <!-- Zelle -->
                <a href="#" class="payment-card">
                    <i class="fa-solid fa-bolt"></i>
                    <h4>Zelle</h4>
                    <p>Fast bank transfer</p>
                </a>

                <!-- Bank Transfer -->
                <a href="#" class="payment-card">
                    <i class="fa-solid fa-building-columns"></i>
                    <h4>Bank Transfer</h4>
                    <p>Direct deposit</p>
                </a>
            </div>
        </section>

        <!-- GALLERY -->
        <section class="gallery-section">
            <div class="section-header">
                <h2>Our <span>Gallery</span></h2>
            </div>
            <div class="gallery-grid">
                <img src="https://i.imgur.com/AzkJaFl.jpeg" alt="Gallery Image 1">
                <img src="https://i.imgur.com/PSrKt9p.jpeg" alt="Gallery Image 2">
                <img src="https://i.imgur.com/7RSQX6f.jpeg" alt="Gallery Image 3">
                <img src="https://i.imgur.com/fkz7KWE.jpeg" alt="Gallery Image 4">
                <img src="https://i.imgur.com/zJEqmfX.jpeg" alt="Gallery Image 5">
                <img src="https://i.imgur.com/xEua6h9.jpeg" alt="Gallery Image 6">
                <img src="https://i.imgur.com/uwlrYzk.jpeg" alt="Gallery Image 7">
                <img src="https://i.imgur.com/mANjb1v.jpeg" alt="Gallery Image 8">
                <img src="https://i.imgur.com/Y1cKYCZ.jpeg" alt="Gallery Image 9">
                <img src="https://i.imgur.com/MktGpvR.jpeg" alt="Gallery Image 10">
                <img src="https://i.imgur.com/b5xaGPZ.jpeg" alt="Gallery Image 11">
                <img src="https://i.imgur.com/LMdsOHA.jpeg" alt="Gallery Image 12">
                <img src="https://i.imgur.com/7RoZdlE.jpeg" alt="Gallery Image 13">
                <img src="https://i.imgur.com/XZAt81N.jpeg" alt="Gallery Image 14">
                <img src="https://i.imgur.com/JejdYO4.jpeg" alt="Gallery Image 15">
            </div>
        </section>

    </div>

</body>
</html>
